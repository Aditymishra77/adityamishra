services:
  web:
    image: node:20-bookworm-slim
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --hostname 0.0.0.0 --port 3000"
    ports:
      - "3000:3000"
    environment:
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_API_URL: http://localhost:4000/api/v1
    volumes:
      - .:/app
      - web_node_modules:/app/node_modules
    depends_on:
      - api

  api:
    image: node:20-bookworm-slim
    working_dir: /app
    command: sh -c "npm install && npm run api:dev"
    ports:
      - "4000:4000"
    environment:
      NODE_ENV: development
      API_PORT: 4000
      CORS_ORIGIN: http://localhost:3000
      JWT_SECRET: change-me-in-production
      JWT_EXPIRES_IN: 1h
      DATABASE_URL: postgresql://postgres:postgres@db:5432/enterprise_app
    volumes:
      - .:/app
      - api_node_modules:/app/node_modules
    depends_on:
      - db

  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: enterprise_app
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./server/database/migrations:/docker-entrypoint-initdb.d

volumes:
  web_node_modules:
  api_node_modules:
  postgres_data:
