services:
  cursorforge:
    build:
      context: .
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development
      NEXT_TELEMETRY_DISABLED: "1"
    volumes:
      - .:/app
      - cursorforge_node_modules:/app/node_modules
    command: npm run dev -- --hostname 0.0.0.0 --port 3000

volumes:
  cursorforge_node_modules:
